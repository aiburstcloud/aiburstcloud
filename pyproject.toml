[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aiburstcloud"
version = "0.1.1"
description = "Dual-mode cloud burst LLM router. Edge-first or cloud-first inference with data sovereignty, cost controls, and automatic failover."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Collin Paran" },
]
keywords = ["llm", "inference", "routing", "edge-computing", "cloud-burst", "ai-infrastructure"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "pydantic>=2.0",
]

# Keep dev extras on one line: scripts/audit.sh greps indented quoted deps
# in this file and compares them against requirements.txt.
[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5", "mypy>=1.10"]

[project.urls]
Homepage = "https://aiburstcloud.com"
Repository = "https://github.com/aiburstcloud/aiburstcloud"
Issues = "https://github.com/aiburstcloud/aiburstcloud/issues"

[project.scripts]
aiburstcloud = "app.cli:main"

[tool.setuptools.packages.find]
include = ["app*"]

# Without this the dashboard HTML is left out of the wheel and /dashboard 404s
# on pip/install.sh installs, while a git checkout works fine.
[tool.setuptools.package-data]
app = ["static/*.html"]

[tool.ruff]
target-version = "py310"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.10"
packages = ["app"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true

[tool.coverage.run]
source = ["app"]
omit = ["app/__main__.py", "app/cli.py"]

[tool.coverage.report]
fail_under = 50
show_missing = true
exclude_lines = [
    'if __name__',
    'pragma: no cover',
]
